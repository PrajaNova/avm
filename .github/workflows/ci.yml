name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Smoke test plugins
        run: |
          target/debug/avm-plugin-node manifest
          target/debug/avm-plugin-java manifest
          target/debug/avm-plugin-android manifest

      - name: Check shared-repository plugin releases
        run: bash scripts/check-plugin-releases.sh

      - name: Check changelog
        run: bash scripts/check-changelog.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Windows e2e (install.ps1, exe shims, node/java/android)
        shell: pwsh
        run: ./e2e/windows.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every PR: build avm from the PR, install it with the PR's install.sh on
  # a clean Ubuntu container, and run the core, node, java and android suites.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run e2e suites
        run: e2e/run.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub API rate limits on shared runners

  plugins:
    strategy:
      fail-fast: false
      matrix:
        plugin: [avm-plugin-node, avm-plugin-java, avm-plugin-android]
    uses: ./.github/workflows/plugin-ci.yml
    with:
      plugin: ${{ matrix.plugin }}
      windows: true
