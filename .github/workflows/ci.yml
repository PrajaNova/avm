name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Decides what to run from the files a PR touches; pushes to main run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
      workspace: ${{ steps.diff.outputs.workspace }}
      plugins: ${{ steps.diff.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed areas
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # The PR checkout is a merge commit; its first parent is the base branch.
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files=ALL
          fi
          has() { [ "$files" = ALL ] || grep -Eq "$1" <<<"$files"; }
          # Code every plugin builds against, plus this pipeline itself.
          shared='^(crates/|Cargo\.(toml|lock)$|rust-toolchain|\.github/workflows/(ci|plugin-ci)\.yml$)'

          has "^marketplace/|^crates/avm-cli/src/cli/args\.rs$|^\.github/workflows/ci\.yml$" && site=true || site=false
          # Workspace-wide jobs also exercise the cli e2e plugins (node, java, android);
          # a python-only change is covered by its own plugin job.
          has "$shared|^(scripts/|crates/avm-cli/tests/shell/|bin/|install\.|package\.json$|CHANGELOG\.md$|plugins/avm-plugin-(node|java|android)/)" && workspace=true || workspace=false

          list=()
          for p in node java python android; do
            if has "$shared|^plugins/avm-plugin-$p/"; then list+=("avm-plugin-$p"); fi
          done
          plugins=$(jq -nc '$ARGS.positional' --args ${list[@]+"${list[@]}"})

          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "changed: site=$site workspace=$workspace plugins=$plugins"

  marketplace:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: marketplace/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation coverage
        run: pnpm run check:docs

      - name: Build marketplace
        run: pnpm run build

  rust:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, self-hosted]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting and lints
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Smoke test plugins
        run: |
          target/debug/avm-plugin-node manifest
          target/debug/avm-plugin-java manifest
          target/debug/avm-plugin-python manifest
          target/debug/avm-plugin-android manifest

      - name: Check shared-repository plugin releases
        run: bash scripts/check-plugin-releases.sh

      - name: Check changelog
        run: bash scripts/check-changelog.sh

  windows:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked

      - name: Windows e2e (install.ps1, exe shims, node/java/android)
        shell: pwsh
        run: ./crates/avm-cli/tests/shell/windows.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every PR: build avm from the PR, install it with the PR's install.sh on
  # a clean Ubuntu container, and run the core, node, java and android suites.
  e2e:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run e2e suites
        run: crates/avm-cli/tests/shell/run.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub API rate limits on shared runners

  plugins:
    needs: changes
    if: needs.changes.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.plugins) }}
    uses: ./.github/workflows/plugin-ci.yml
    with:
      plugin: ${{ matrix.plugin }}
      windows: true
