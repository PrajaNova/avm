name: Test plugins (reusable)

# Called from each plugin's own CI (this repo: plugin-<name>-ci.yml; other repos: their ci.yml).
# Pass `windows: true` once the plugin supports Windows (same switch as plugin-release.yml).
# `format` and `lint` add a rustfmt check and clippy with -D warnings; both default to off so
# existing callers are unaffected. Tests and the release build + `manifest` smoke test always run.
on:
  workflow_call:
    inputs:
      plugin:
        description: "Workspace package (defaults to repository name)"
        type: string
        default: ""
      windows:
        type: boolean
        default: false
      format:
        type: boolean
        default: false
      lint:
        type: boolean
        default: false

jobs:
  quality:
    name: Format and lint
    if: ${{ inputs.format || inputs.lint }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        if: ${{ inputs.format }}
        run: cargo fmt --package ${{ inputs.plugin || github.event.repository.name }} --check

      - name: Lint
        if: ${{ inputs.lint }}
        run: cargo clippy --package ${{ inputs.plugin || github.event.repository.name }} --all-targets --locked -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, self-hosted]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --package ${{ inputs.plugin || github.event.repository.name }}

      - name: Build and smoke test
        shell: bash
        run: cargo build --release --package ${{ inputs.plugin || github.event.repository.name }} && target/release/${{ inputs.plugin || github.event.repository.name }} manifest

  build-windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --package ${{ inputs.plugin || github.event.repository.name }}

      - name: Build and smoke test
        run: cargo build --release --package ${{ inputs.plugin || github.event.repository.name }}; target/release/${{ inputs.plugin || github.event.repository.name }}.exe manifest
