name: Test plugins (reusable)

# Called from each plugin repo's ci.yml. Pass `windows: true` once the
# plugin supports Windows (same switch as plugin-release.yml).
on:
  workflow_call:
    inputs:
      plugin:
        description: "Workspace package (defaults to repository name)"
        type: string
        default: ""
      windows:
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --package ${{ inputs.plugin || github.event.repository.name }}

      - name: Build and smoke test
        shell: bash
        run: cargo build --release --package ${{ inputs.plugin || github.event.repository.name }} && target/release/${{ inputs.plugin || github.event.repository.name }} manifest

  build-windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --package ${{ inputs.plugin || github.event.repository.name }}

      - name: Build and smoke test
        run: cargo build --release --package ${{ inputs.plugin || github.event.repository.name }}; target/release/${{ inputs.plugin || github.event.repository.name }}.exe manifest
