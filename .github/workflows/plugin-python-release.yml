name: Plugin python release
run-name: Plugin python release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching plugins/avm-plugin-python/Cargo.toml (without v)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-plugin-python
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/plugin-release.yml
    with:
      plugin: python
      version: ${{ inputs.version }}
      windows: true
    secrets: inherit
