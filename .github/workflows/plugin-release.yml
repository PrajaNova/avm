name: Publish plugin (reusable)

# First-party releases use namespaced tags and are marked as prereleases so
# /releases/latest remains the CLI release. The registry pins each plugin tag.
on:
  workflow_call:
    inputs:
      plugin:
        description: "Workspace plugin name; empty for standalone repositories"
        type: string
        default: ""
      version:
        required: true
        type: string
      windows:
        type: boolean
        default: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  PLUGIN: ${{ inputs.plugin && format('avm-plugin-{0}', inputs.plugin) || github.event.repository.name }}
  RELEASE_TAG: ${{ inputs.plugin && format('avm-plugin-{0}-v{1}', inputs.plugin, inputs.version) || format('v{0}', inputs.version) }}

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version is new and run from main
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Run releases from main, not $GITHUB_REF"; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release version"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Tag ${RELEASE_TAG} already exists"; exit 1
          fi

      - name: Check Cargo.toml version
        shell: bash
        run: |
          manifest="Cargo.toml"
          if [ -d "plugins/${PLUGIN}" ]; then manifest="plugins/${PLUGIN}/Cargo.toml"; fi
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -n 1)"
          [ "$cargo_version" = "$RELEASE_VERSION" ] || { echo "Cargo.toml version $cargo_version != $RELEASE_VERSION"; exit 1; }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test release package
        run: cargo test --locked --package "${{ env.PLUGIN }}"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_arch: amd64
          - os: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
          - os: macos-latest
            target_os: darwin
            target_arch: arm64
          - os: macos-15-intel
            target_os: darwin
            target_arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release --package ${{ env.PLUGIN }}

      - name: Smoke test
        run: target/release/${{ env.PLUGIN }} manifest

      - name: Create release archive
        shell: bash
        run: |
          archive="${{ env.PLUGIN }}_${{ matrix.target_os }}_${{ matrix.target_arch }}.tar.gz"
          mkdir -p dist
          cp target/release/${{ env.PLUGIN }} dist/${{ env.PLUGIN }}
          tar -C dist -czf "$archive" ${{ env.PLUGIN }}
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

  build-windows:
    needs: validate
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release --package ${{ env.PLUGIN }}

      - name: Smoke test
        run: target/release/${{ env.PLUGIN }}.exe manifest

      - name: Create release archive
        shell: pwsh
        run: |
          $archive = "${{ env.PLUGIN }}_windows_amd64.zip"
          Compress-Archive -Path "target/release/${{ env.PLUGIN }}.exe" -DestinationPath $archive
          "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

  github-release:
    needs: [build, build-windows]
    # build-windows is skipped for plugins without Windows support.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz $(ls *.zip 2>/dev/null) > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/avm-plugin-*

      # Immutable releases (repo setting) refuse asset uploads once a
      # prerelease is published — only drafts stay open for uploads. Create
      # as a draft, then flip it live once every asset is attached.
      - name: Publish GitHub release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.PLUGIN }} v${{ inputs.version }}
          prerelease: ${{ inputs.plugin != '' }}
          draft: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/avm-plugin-*
            dist/checksums.txt
          generate_release_notes: true

      - name: Publish release (undraft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ env.RELEASE_TAG }}" --draft=false -R ${{ github.repository }}
