name: Plugin release (reusable)

# Called from each plugin repo's manually-run release.yml with the version
# to publish; this creates the v<version> tag and GitHub release.
on:
  workflow_call:
    inputs:
      version:
        description: "Version without the v, matching Cargo.toml"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version is new and run from main
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ github.ref }}" = "refs/heads/main" ] || { echo "Run releases from main, not ${{ github.ref }}"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null; then
            echo "Tag v${{ inputs.version }} already exists"; exit 1
          fi

      - name: Check Cargo.toml version
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ "$cargo_version" = "${{ inputs.version }}" ] || { echo "Cargo.toml version $cargo_version != ${{ inputs.version }}"; exit 1; }

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_arch: amd64
          - os: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
          - os: macos-latest
            target_os: darwin
            target_arch: arm64
          - os: macos-15-intel
            target_os: darwin
            target_arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test
        run: target/release/${{ github.event.repository.name }} manifest

      - name: Create release archive
        shell: bash
        run: |
          archive="${{ github.event.repository.name }}_${{ matrix.target_os }}_${{ matrix.target_arch }}.tar.gz"
          mkdir -p dist
          cp target/release/${{ github.event.repository.name }} dist/${{ github.event.repository.name }}
          tar -C dist -czf "$archive" ${{ github.event.repository.name }}
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
