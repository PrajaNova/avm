name: Release AVM CLI

# Manual only: Actions → Release AVM CLI → Run workflow, or
#   gh workflow run release-avm.yml -R PrajaNova/avm -f version=0.4.0
# The workflow creates the v<version> tag and GitHub release itself; pushing
# a tag does nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, matching package.json (e.g. 0.4.0 or 0.4.0-beta-1)"
        required: true
        type: string
      npm_only:
        description: "Only (re)publish npm for an already-released version"
        type: boolean
        default: false

env:
  RELEASE_TAG: v${{ inputs.version }}

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version is new and run from main
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ github.ref }}" = "refs/heads/main" ] || { echo "Run releases from main, not ${{ github.ref }}"; exit 1; }
          exists=false
          git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null && exists=true
          if [ "${{ inputs.npm_only }}" = "true" ]; then
            [ "$exists" = true ] || { echo "npm_only needs an existing v${{ inputs.version }} release"; exit 1; }
          elif [ "$exists" = true ]; then
            echo "Tag v${{ inputs.version }} already exists"; exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Check release version and changelog
        run: bash scripts/check-release-version.sh

  build:
    needs: validate
    if: ${{ !inputs.npm_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: avm_linux_amd64.tar.gz
          - os: ubuntu-24.04-arm
            archive: avm_linux_arm64.tar.gz
          - os: macos-latest
            archive: avm_darwin_arm64.tar.gz
          - os: macos-15-intel
            archive: avm_darwin_amd64.tar.gz
          - os: windows-latest
            archive: avm_windows_amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --package avm-cli --bin avm-bin

      - name: Smoke test
        run: target/release/avm-bin --version

      - name: Create release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/avm-bin dist/avm-bin
          tar -C dist -czf "${{ matrix.archive }}" avm-bin

      - name: Create release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/avm-bin.exe -DestinationPath "${{ matrix.archive }}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum avm_* > checksums.txt

      # Scoop manifest as a release asset, so
      #   scoop install https://github.com/PrajaNova/avm/releases/latest/download/avm.json
      # always gets the newest version with its verified hash.
      - name: Generate Scoop manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          hash="$(awk '$2 == "avm_windows_amd64.zip" {print $1}' dist/checksums.txt)"
          jq -n --arg v "$version" --arg h "$hash" --arg url "https://github.com/PrajaNova/avm/releases/download/${RELEASE_TAG}/avm_windows_amd64.zip" '{
            version: $v,
            description: "Any Version Manager: per-directory node/java/Android SDK versions, project aliases and env",
            homepage: "https://github.com/PrajaNova/avm",
            license: "MIT",
            architecture: { "64bit": { url: $url, hash: $h } },
            bin: "avm-bin.exe",
            notes: "Add avm to PowerShell: Add-Content $PROFILE \u0027Invoke-Expression ((& avm-bin shell-init pwsh) -join \"`n\")\u0027"
          }' > dist/avm.json
          cat dist/avm.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/avm_*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/avm_*
            dist/avm.json
            dist/checksums.txt
          generate_release_notes: true

  # Auth: npm trusted publishing (OIDC, no secret; configure once on
  # npmjs.com, see docs/ops/RELEASE.md), or an NPM_TOKEN repo secret.
  npm:
    needs: [validate, github-release]
    # Runs after a full release, or alone with npm_only (github-release skipped).
    if: ${{ !cancelled() && needs.validate.result == 'success' && (inputs.npm_only || needs.github-release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm (trusted publishing and `npm stage` need a current npm)
        run: npm install -g npm@latest

      # Staged: the version waits on npm until a maintainer approves it with
      # 2FA (npmjs.com, or `npm stage approve @prajanova/avm@<version>`).
      # Prereleases (0.4.0-beta-1) go to the `beta` dist-tag, never `latest`.
      - name: Stage npm package
        run: npm stage publish --access public ${{ contains(inputs.version, '-') && '--tag beta' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  homebrew:
    needs: github-release
    if: ${{ !inputs.npm_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: prajanova/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base_url="https://github.com/prajanova/avm/releases/download/${RELEASE_TAG}"
          linux_amd64_sha="$(sha256sum dist/avm_linux_amd64.tar.gz | awk '{print $1}')"
          linux_arm64_sha="$(sha256sum dist/avm_linux_arm64.tar.gz | awk '{print $1}')"
          darwin_arm64_sha="$(sha256sum dist/avm_darwin_arm64.tar.gz | awk '{print $1}')"
          darwin_amd64_sha="$(sha256sum dist/avm_darwin_amd64.tar.gz | awk '{print $1}')"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/avm.rb <<RUBY
          class Avm < Formula
            desc "Any Version Manager with aliases, shims, and provider plugins"
            homepage "https://github.com/prajanova/avm"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base_url}/avm_darwin_arm64.tar.gz"
                sha256 "${darwin_arm64_sha}"
              end

              on_intel do
                url "${base_url}/avm_darwin_amd64.tar.gz"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              on_arm do
                url "${base_url}/avm_linux_arm64.tar.gz"
                sha256 "${linux_arm64_sha}"
              end

              on_intel do
                url "${base_url}/avm_linux_amd64.tar.gz"
                sha256 "${linux_amd64_sha}"
              end
            end

            def install
              bin.install "avm-bin"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/avm-bin --version")
            end
          end
          RUBY

      - name: Commit formula update
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/avm.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
          else
            git commit -m "Update avm to ${RELEASE_TAG}"
            git push
          fi
