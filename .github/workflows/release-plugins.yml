name: Release workspace plugins
run-name: Release ${{ inputs.plugin }} plugin v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to publish in PrajaNova/avm"
        required: true
        type: choice
        options:
          - node
          - java
          - android
      version:
        description: "Version matching plugins/avm-plugin-<name>/Cargo.toml (without v)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-plugin-${{ inputs.plugin }}
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/plugin-release.yml
    with:
      plugin: ${{ inputs.plugin }}
      version: ${{ inputs.version }}
      windows: true
    secrets: inherit
