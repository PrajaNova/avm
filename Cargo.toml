[workspace]
resolver = "2"
members = [
    "crates/avm-cli",
    "crates/avm-plugin-api",
    "plugins/avm-plugin-node",
    "plugins/avm-plugin-java",
    "plugins/avm-plugin-android",
]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
