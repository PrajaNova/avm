[package]
name = "avm-plugin-android"
version = "0.3.0"
edition = "2021"
description = "avm native provider for the Android SDK (cmdline-tools, platform-tools, sdkmanager). Speaks avm's plugin protocol (https://github.com/PrajaNova/avm)."
license = "MIT"
repository = "https://github.com/PrajaNova/avm"

[dependencies]
avm-plugin-api = { path = "../../crates/avm-plugin-api" }
anyhow = { workspace = true }
serde_json = { workspace = true }
