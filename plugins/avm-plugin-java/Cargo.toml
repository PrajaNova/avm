[package]
name = "avm-plugin-java"
version = "0.3.1"
edition = "2021"
description = "avm native provider for OpenJDK (Eclipse Temurin via the foojay Disco API). Speaks avm's plugin protocol (https://github.com/PrajaNova/avm)."
license = "MIT"
repository = "https://github.com/PrajaNova/avm"

[dependencies]
avm-plugin-api = { path = "../../crates/avm-plugin-api" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
