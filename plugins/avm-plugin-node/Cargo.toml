[package]
name = "avm-plugin-node"
version = "0.3.4"
edition = "2021"
description = "avm native provider for Node.js — versions, install, package.json scripts. Speaks avm's plugin protocol (https://github.com/PrajaNova/avm)."
license = "MIT"
repository = "https://github.com/PrajaNova/avm"

[dependencies]
avm-plugin-sdk = { path = "../../crates/avm-plugin-sdk" }
anyhow = { workspace = true }
fs-err = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
