[package]
name = "avm-plugin-python"
version = "0.1.0"
edition = "2021"
description = "avm native provider for CPython (python-build-standalone builds). Speaks avm's plugin protocol (https://github.com/PrajaNova/avm)."
license = "MIT"
repository = "https://github.com/PrajaNova/avm"

[dependencies]
avm-plugin-sdk = { path = "../../crates/avm-plugin-sdk" }
anyhow = { workspace = true }
fs-err = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
